name: Release packages and assets
on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      release_id:
        required: true
        type: string
      release_body:
        required: true
        type: string
      notes_digest:
        required: true
        type: string
permissions:
  contents: write
  actions: read
  id-token: write
jobs:
  wheels:
    name: Wheel ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto, image: 'python:3.12-slim', platform:
              linux/amd64}
          - {name: linux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: auto, image: 'python:3.12-slim',
              platform: linux/arm64}
          - {name: musl-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, image: 'python:3.12-alpine',
            platform: linux/amd64}
          - {name: musl-aarch64, os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2, image: 'python:3.12-alpine',
            platform: linux/arm64}
          - {name: macos-x86_64, os: macos-15-intel, target: x86_64, manylinux: auto}
          - {name: macos-arm64, os: macos-14, target: aarch64, manylinux: auto}
          - {name: windows-x86_64, os: windows-latest, target: x86_64, manylinux: auto}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Expose the candidate tag locally
        if: ${{ !inputs.publish }}
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          git tag "$CANDIDATE_TAG" "${{ inputs.source_sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check versions
        shell: bash
        run: python scripts/check_version.py '${{ inputs.tag }}'
      - uses: docker/setup-qemu-action@v3
        if: runner.os == 'Linux'
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Gate Linux wheel with real Docling Core
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm --platform '${{ matrix.platform }}' -v "$PWD:/work:ro" '${{ matrix.image }}' sh -ec 'pip install --only-binary=:all: /work/dist/*.whl; cd /tmp; python /work/scripts/wheel_gate.py /work/dist/*.whl'
      - name: Gate native wheel
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python -m pip install $(echo dist/*.whl)
          python scripts/wheel_gate.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}-${{ inputs.publish && 'publish' || 'check' }}
          path: dist/*.whl
    timeout-minutes: 30
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Expose the candidate tag locally
        if: ${{ !inputs.publish }}
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          git tag "$CANDIDATE_TAG" "${{ inputs.source_sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install maturin
      - run: python scripts/check_version.py '${{ inputs.tag }}'
      - run: maturin sdist --out dist
      - run: python -m pip install dist/*.tar.gz
      - run: python scripts/wheel_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: sdist-${{ inputs.publish && 'publish' || 'check' }}
          path: dist/*.tar.gz
    timeout-minutes: 30
  publish:
    name: Publish to PyPI
    if: startsWith(format('refs/tags/{0}', inputs.tag), 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Verify approval and checked tag before publishing
        working-directory: ${{ github.workspace }}
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          RELEASE_NOTES_DIGEST: ${{ inputs.notes_digest }}
        run: python .github/scripts/release-lane.py permit
      - name: Expose the candidate tag locally
        if: ${{ !inputs.publish }}
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          git tag "$CANDIDATE_TAG" "${{ inputs.source_sha }}"
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*-${{ inputs.publish && 'publish' || 'check' }}
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist-${{ inputs.publish && 'publish' || 'check' }}
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-checked-distributions-${{ inputs.publish && 'publish' || 'check' }}
          path: dist/
          if-no-files-found: error
    timeout-minutes: 30
  github-release:
    name: GitHub release
    if: startsWith(format('refs/tags/{0}', inputs.tag), 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Expose the candidate tag locally
        if: ${{ !inputs.publish }}
        shell: bash
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: |
          git tag "$CANDIDATE_TAG" "${{ inputs.source_sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*-${{ inputs.publish && 'publish' || 'check' }}
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist-${{ inputs.publish && 'publish' || 'check' }}
          path: dist
      - run: python scripts/release_notes.py "$LANE_TAG" release-notes.md
    timeout-minutes: 30
env:
  LANE_TAG: ${{ inputs.tag }}
  LANE_REF: ${{ format('refs/tags/{0}', inputs.tag) }}
  LANE_REF_TYPE: tag
  LANE_PUBLISH: ${{ inputs.publish }}
