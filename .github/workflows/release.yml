name: Release artifacts
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without v; leave empty for rehearsal
        required: false
        type: string
  pull_request:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  wheels:
    name: Wheel ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto, image: 'python:3.12-slim', platform:
              linux/amd64}
          - {name: linux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: auto, image: 'python:3.12-slim',
              platform: linux/arm64}
          - {name: musl-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, image: 'python:3.12-alpine',
            platform: linux/amd64}
          - {name: musl-aarch64, os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2, image: 'python:3.12-alpine',
            platform: linux/arm64}
          - {name: macos-x86_64, os: macos-15-intel, target: x86_64, manylinux: auto}
          - {name: macos-arm64, os: macos-14, target: aarch64, manylinux: auto}
          - {name: windows-x86_64, os: windows-latest, target: x86_64, manylinux: auto}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check versions
        shell: bash
        run: python scripts/check_version.py "$RELEASE_TAG"
      - uses: docker/setup-qemu-action@v3
        if: runner.os == 'Linux'
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Gate Linux wheel with real Docling Core
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm --platform '${{ matrix.platform }}' -v "$PWD:/work:ro" '${{ matrix.image }}' sh -ec 'pip install --only-binary=:all: /work/dist/*.whl; cd /tmp; python /work/scripts/wheel_gate.py /work/dist/*.whl'
      - name: Gate native wheel
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python -m pip install $(echo dist/*.whl)
          python scripts/wheel_gate.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install maturin
      - run: python scripts/check_version.py "$RELEASE_TAG"
      - run: maturin sdist --out dist
      - run: python -m pip install dist/*.tar.gz
      - run: python scripts/wheel_gate.py
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
  publish:
    name: Publish to PyPI
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name ==
      'workflow_dispatch' && inputs.version != '')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Create the release tag after approval
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must be X.Y.Z"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            remote="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | tail -1 | cut -f1)"
            [ "$remote" = "$GITHUB_SHA" ] || { echo "::error::Existing tag points to another commit"; exit 1; }
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
  github-release:
    name: GitHub release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name ==
      'workflow_dispatch' && inputs.version != '')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - run: python scripts/release_notes.py "$RELEASE_TAG" release-notes.md
      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            if [ "$draft" = true ]; then
              gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --draft=false --notes-file release-notes.md
            fi
          else
            gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
env:
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_TAG: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
