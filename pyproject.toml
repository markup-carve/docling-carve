[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "docling-carve"
version = "0.1.0"
description = "Docling documents to Carve with provenance and preservation diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "markup-carve"}]
dependencies = ["docling-core>=2.99,<3"]
keywords = ["docling", "carve", "document-conversion", "serializer"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Rust", "Typing :: Typed"]

[project.optional-dependencies]
extract = ["docling>=2.133,<3"]
http = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
mcp = ["mcp>=2.3,<3"]
dev = ["pytest>=8,<9", "httpx>=0.28,<1", "jsonschema>=4,<5", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
docling-carve = "docling_carve.cli:main"

[project.urls]
Repository = "https://github.com/markup-carve/docling-carve"
Documentation = "https://github.com/markup-carve/docling-carve#readme"
Issues = "https://github.com/markup-carve/docling-carve/issues"
Changelog = "https://github.com/markup-carve/docling-carve/blob/main/CHANGELOG.md"

[tool.maturin]
module-name = "docling_carve._native"
python-source = "python"
include = ["python/docling_carve/schemas/*.json"]
exclude = [".github/**", "tests/**", "docs/**", "examples/**", "scripts/**", "_*/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
