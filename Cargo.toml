[package]
name = "docling-carve-native"
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/markup-carve/docling-carve"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["abi3-py310", "extension-module"] }
carve = { package = "carve-lang", git = "https://github.com/markup-carve/carve-rs", rev = "7fb7c24956298e78bc4716ff7e0e1fb96e60ecdf", default-features = false }
