[package]
name = "docling-carve-native"
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/markup-carve/docling-carve"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["abi3-py310", "extension-module"] }
carve = { package = "carve-lang", git = "https://github.com/markup-carve/carve-rs", rev = "48f27d02368df9310c2b2a694076653106a8d0ea", default-features = false }
