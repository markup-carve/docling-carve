[package]
name = "docling-carve-native"
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/markup-carve/docling-carve"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["abi3-py310", "extension-module"] }
carve = { package = "carve-lang", git = "https://github.com/markup-carve/carve-rs", rev = "284c05f30da3a00a0e7a1fd42fea9f5ce430d6dd", default-features = false }
